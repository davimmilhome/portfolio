<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Tempo investido · visão visual da infraestrutura</title>
  <desc id="desc">Diagrama simplificado do fluxo entre navegador, aplicação web, banco de dados e serviços de apoio.</desc>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#173225}
    .title{font-size:30px;font-weight:600;letter-spacing:-.02em}
    .section-label{font-size:12px;font-weight:600;letter-spacing:1.2px;fill:#53695D}
    .card-title{font-size:20px;font-weight:600}
    .body{font-size:16px}
    .small{font-size:13px}
    .muted{fill:#53695D}
    .card{fill:#FFFFFF;stroke:#D8E5DC;stroke-width:2}
    .app{fill:#E8F5EC;stroke:#2F7650;stroke-width:2}
    .data{fill:#EDF5FF;stroke:#3E6E9A;stroke-width:2}
    .delivery{fill:#FFF9EA;stroke:#93651C;stroke-width:2}
    .boundary{fill:#FBFDFC;stroke:#B9CFC0;stroke-width:2;stroke-dasharray:10 8}
    .arrow{stroke:#2F7650;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .support{stroke:#3E6E9A;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrowBlue)}
    .tag{fill:#FFFFFF;stroke:#B9CFC0;stroke-width:1.5}
    .chip{fill:#FFFFFF;stroke:#D8E5DC;stroke-width:1.2}
    .chip-text{font-size:12px;font-weight:600;fill:#173225}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F7650"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3E6E9A"/></marker>
  </defs>

  <rect width="1280" height="900" fill="#FFFFFF"/>
  <text x="64" y="62" class="ui title">Tempo investido · visão simples da infraestrutura</text>
  <text x="64" y="94" class="ui body muted">O caminho de um registro de tempo, do acesso até a persistência.</text>

  <rect x="48" y="132" width="1184" height="544" rx="18" class="boundary"/>
  <text x="76" y="168" class="ui section-label">FLUXO PRINCIPAL E SERVIÇOS DE APOIO</text>

  <!-- Fluxo principal: os três cartões seguem uma única linha de leitura. -->
  <rect x="80" y="238" width="250" height="190" rx="16" class="card"/>
  <text x="112" y="282" class="ui card-title">Navegador</text>
  <text x="112" y="316" class="ui body">Onde a pessoa usa</text>
  <text x="112" y="342" class="ui body">o timer e consulta</text>
  <text x="112" y="368" class="ui body">seus resultados.</text>
  <rect x="112" y="390" width="78" height="26" rx="7" class="chip"/>
  <text x="126" y="407" class="chip-text">HTTPS</text>

  <rect x="390" y="200" width="320" height="260" rx="16" class="app"/>
  <text x="422" y="246" class="ui card-title">Aplicação web</text>
  <text x="422" y="282" class="ui body">Recebe os pedidos,</text>
  <text x="422" y="308" class="ui body">valida os dados e aplica</text>
  <text x="422" y="334" class="ui body">as regras do produto.</text>
  <rect x="422" y="400" width="92" height="30" rx="7" class="chip"/><image x="432" y="407" width="16" height="16" href="https://cdn.simpleicons.org/python/3776AB" preserveAspectRatio="xMidYMid meet"/><text x="454" y="420" class="chip-text">Python</text>
  <rect x="522" y="400" width="96" height="30" rx="7" class="chip"/><image x="532" y="407" width="16" height="16" href="https://cdn.simpleicons.org/django/0C4B33" preserveAspectRatio="xMidYMid meet"/><text x="554" y="420" class="chip-text">Django</text>
  <rect x="620" y="400" width="72" height="30" rx="7" class="chip"/><image x="630" y="407" width="16" height="16" href="https://cdn.simpleicons.org/render/46E3B7" preserveAspectRatio="xMidYMid meet"/><text x="652" y="420" class="chip-text">Render</text>

  <rect x="790" y="200" width="320" height="260" rx="16" class="data"/>
  <text x="822" y="246" class="ui card-title">Banco de dados</text>
  <text x="822" y="282" class="ui body">Guarda contas,</text>
  <text x="822" y="308" class="ui body">atividades e registros</text>
  <text x="822" y="334" class="ui body">de tempo.</text>
  <rect x="822" y="400" width="136" height="30" rx="7" class="chip"/><image x="832" y="407" width="16" height="16" href="https://cdn.simpleicons.org/postgresql/4169E1" preserveAspectRatio="xMidYMid meet"/><text x="854" y="420" class="chip-text">PostgreSQL</text>
  <rect x="966" y="400" width="90" height="30" rx="7" class="chip"/><image x="976" y="407" width="16" height="16" href="https://cdn.simpleicons.org/neon/00A884" preserveAspectRatio="xMidYMid meet"/><text x="998" y="420" class="chip-text">Neon</text>

  <!-- Serviços de apoio: entram por baixo, sem cruzar os cartões principais. -->
  <rect x="390" y="532" width="320" height="124" rx="16" class="card"/>
  <text x="422" y="578" class="ui card-title">Cache</text>
  <text x="422" y="608" class="ui body">Acelera consultas temporárias.</text>
  <rect x="422" y="620" width="84" height="28" rx="7" class="chip"/><image x="432" y="626" width="16" height="16" href="https://cdn.simpleicons.org/redis/DC382D" preserveAspectRatio="xMidYMid meet"/><text x="454" y="639" class="chip-text">Redis</text>

  <rect x="790" y="532" width="320" height="124" rx="16" class="card"/>
  <text x="822" y="578" class="ui card-title">E-mail</text>
  <text x="822" y="608" class="ui body">Ajuda a recuperar contas.</text>
  <rect x="822" y="620" width="88" height="28" rx="7" class="chip"/><image x="832" y="626" width="16" height="16" href="https://cdn.simpleicons.org/brevo/0B996E" preserveAspectRatio="xMidYMid meet"/><text x="854" y="639" class="chip-text">Brevo</text>

  <!-- Conexões ficam nos espaços vazios entre cartões. -->
  <path d="M330 333 H378" class="arrow"/>
  <rect x="338" y="288" width="44" height="28" rx="8" class="tag"/>
  <text x="360" y="306" text-anchor="middle" class="ui small">entra</text>
  <path d="M710 333 H778" class="arrow"/>
  <rect x="725" y="288" width="50" height="28" rx="8" class="tag"/>
  <text x="750" y="306" text-anchor="middle" class="ui small">persiste</text>

  <path d="M550 460 V522" class="support"/>
  <path d="M650 460 C700 486 748 500 810 522" class="support"/>

  <text x="64" y="716" class="ui section-label">ENTREGA E PERSISTÊNCIA</text>
  <rect x="64" y="734" width="552" height="122" rx="16" class="delivery"/>
  <text x="96" y="776" class="ui card-title">Entrega do projeto</text>
  <text x="96" y="806" class="ui body">Testes e publicação automatizada.</text>
  <rect x="96" y="820" width="150" height="28" rx="7" class="chip"/><image x="106" y="826" width="16" height="16" href="https://cdn.simpleicons.org/githubactions/2088FF" preserveAspectRatio="xMidYMid meet"/><text x="128" y="839" class="chip-text">GitHub Actions</text>
  <rect x="256" y="820" width="96" height="28" rx="7" class="chip"/><image x="266" y="826" width="16" height="16" href="https://cdn.simpleicons.org/render/46E3B7" preserveAspectRatio="xMidYMid meet"/><text x="288" y="839" class="chip-text">Render</text>

  <rect x="664" y="734" width="552" height="122" rx="16" class="card"/>
  <text x="696" y="776" class="ui card-title">O que fica persistente?</text>
  <text x="696" y="806" class="ui body">Os dados permanentes ficam no banco.</text>
  <text x="696" y="832" class="ui body">O servidor pode ser substituído sem perder registros.</text>
</svg>
